<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 980">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'Hiragino Sans GB', 'PingFang SC', sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="menuBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b3d2e"/>
      <stop offset="1" stop-color="#134e4a"/>
    </linearGradient>
    <linearGradient id="btnPrimary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="btnSecondary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(255,255,255,0.16)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0.08)"/>
    </linearGradient>
    <radialGradient id="iconBg" cx="0.5" cy="0.35" r="0.9">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f97316"/>
    </radialGradient>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="30" y="42" fill="white" font-size="17" font-weight="700">HappyEat 界面美化设计蓝图 — 主菜单 / 游戏 HUD / 启动图标</text>
  <text x="30" y="66" fill="#94a3b8" font-size="10">v2 视觉迭代 · 生成提示词的设计基准 · 卡通厚描边风格与现有精灵一致</text>

  <!-- ============ PHONE 1: 主菜单 ============ -->
  <g>
    <rect x="40" y="100" width="320" height="700" rx="24" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <rect x="52" y="112" width="296" height="676" rx="16" fill="url(#menuBg)"/>
    <text x="200" y="140" fill="#94a3b8" font-size="11" text-anchor="middle" font-weight="600">① 主菜单 StartMenu</text>

    <!-- emblem: boy catching golden bean arc -->
    <circle cx="200" cy="260" r="64" fill="rgba(251,191,36,0.12)" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="178" cy="248" r="10" fill="#fbbf24"/>
    <circle cx="204" cy="232" r="8" fill="#fcd34d"/>
    <circle cx="224" cy="250" r="7" fill="#fbbf24"/>
    <circle cx="196" cy="272" r="12" fill="#fb923c"/>
    <text x="200" y="278" fill="#7c2d12" font-size="12" text-anchor="middle" font-weight="700">🧑</text>
    <text x="200" y="352" fill="white" font-size="30" text-anchor="middle" font-weight="700">HappyEat</text>
    <text x="200" y="374" fill="#fcd34d" font-size="10" text-anchor="middle">接住美味 · 躲开危险</text>

    <!-- buttons -->
    <rect x="92" y="404" width="216" height="56" rx="28" fill="url(#btnPrimary)" stroke="#fde68a" stroke-width="1.5"/>
    <text x="200" y="438" fill="#7c2d12" font-size="14" text-anchor="middle" font-weight="700">▶ 开始游戏</text>
    <rect x="92" y="478" width="216" height="46" rx="23" fill="url(#btnSecondary)" stroke="#94a3b8" stroke-width="1"/>
    <text x="200" y="506" fill="white" font-size="12" text-anchor="middle" font-weight="600">🏆 排行榜</text>
    <rect x="92" y="538" width="216" height="46" rx="23" fill="url(#btnSecondary)" stroke="#94a3b8" stroke-width="1"/>
    <text x="200" y="566" fill="white" font-size="12" text-anchor="middle" font-weight="600">⚙ 设置</text>
    <rect x="92" y="598" width="216" height="46" rx="23" fill="url(#btnSecondary)" stroke="#94a3b8" stroke-width="1"/>
    <text x="200" y="626" fill="white" font-size="12" text-anchor="middle" font-weight="600">❓ 帮助</text>

    <text x="200" y="686" fill="#94a3b8" font-size="9" text-anchor="middle">背景: 实时游戏场景作底 + 深绿渐变压暗</text>
    <text x="200" y="712" fill="#64748b" font-size="8" text-anchor="middle">BGM 提示: 🎵 图标随音乐律动 (可选)</text>
  </g>

  <!-- ============ PHONE 2: 游戏 HUD ============ -->
  <g>
    <rect x="420" y="100" width="320" height="700" rx="24" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <rect x="432" y="112" width="296" height="676" rx="16" fill="#7dd3fc"/>
    <rect x="432" y="560" width="296" height="228" rx="0" fill="#86efac"/>
    <rect x="432" y="112" width="296" height="676" rx="16" fill="none" stroke="#334155" stroke-width="0"/>
    <text x="580" y="140" fill="#0f172a" font-size="11" text-anchor="middle" font-weight="600" fill-opacity="0.85">② 游戏 HUD (半透明底板)</text>

    <!-- score pill -->
    <rect x="446" y="152" width="150" height="66" rx="14" fill="rgba(15,23,42,0.45)"/>
    <text x="462" y="176" fill="white" font-size="13" font-weight="700">分数 128</text>
    <text x="462" y="196" fill="#fcd34d" font-size="11">❤❤❤ ×5</text>
    <!-- vehicle chip -->
    <rect x="446" y="226" width="150" height="30" rx="15" fill="rgba(251,191,36,0.75)"/>
    <text x="521" y="246" fill="#7c2d12" font-size="10" text-anchor="middle" font-weight="700">🚗 骑乘 7s · 撞击 1/3</text>
    <!-- circular buttons -->
    <circle cx="672" cy="180" r="26" fill="rgba(15,23,42,0.45)" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="672" y="186" fill="white" font-size="14" text-anchor="middle">⏸</text>
    <circle cx="672" cy="244" r="26" fill="rgba(15,23,42,0.45)" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="672" y="250" fill="white" font-size="14" text-anchor="middle">⚙</text>

    <!-- falling items with rings -->
    <circle cx="520" cy="330" r="30" fill="none" stroke="#22c55e" stroke-width="4"/>
    <text x="520" y="338" fill="#7c2d12" font-size="22" text-anchor="middle">🫘</text>
    <text x="568" y="336" fill="#0f172a" font-size="9">绿圈=能吃</text>
    <circle cx="600" cy="420" r="30" fill="none" stroke="#ef4444" stroke-width="4"/>
    <text x="600" y="428" fill="#334155" font-size="22" text-anchor="middle">💣</text>
    <text x="648" y="426" fill="#0f172a" font-size="9">红圈=危险</text>
    <circle cx="500" cy="470" r="30" fill="none" stroke="#f59e0b" stroke-width="4"/>
    <text x="500" y="478" fill="#1e3a8a" font-size="22" text-anchor="middle">🚗</text>
    <text x="548" y="476" fill="#0f172a" font-size="9">黄圈=载具</text>

    <!-- player -->
    <text x="580" y="736" fill="#7c2d12" font-size="26" text-anchor="middle">🧑</text>
    <text x="470" y="730" fill="#0f172a" font-size="9">跳跃: 点按 ⬆</text>
  </g>

  <!-- ============ PHONE 3: 启动图标 ============ -->
  <g>
    <rect x="800" y="100" width="320" height="700" rx="24" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <text x="960" y="140" fill="#94a3b8" font-size="11" text-anchor="middle" font-weight="600">③ 启动图标 Launcher Icon</text>
    <!-- squircle icon -->
    <rect x="850" y="170" width="220" height="220" rx="52" fill="url(#iconBg)" stroke="#fde68a" stroke-width="3"/>
    <circle cx="925" cy="255" r="26" fill="#92400e"/>
    <text x="925" y="264" fill="#fde68a" font-size="22" text-anchor="middle">🫘</text>
    <text x="985" y="250" fill="#7c2d12" font-size="34" text-anchor="middle" font-weight="700">🧑</text>
    <text x="960" y="352" fill="#7c2d12" font-size="18" text-anchor="middle" font-weight="700">HappyEat</text>
    <text x="960" y="436" fill="#94a3b8" font-size="9" text-anchor="middle">构图: 男孩张手接住金色豆子, 豆子弧线排布</text>
    <text x="960" y="454" fill="#94a3b8" font-size="9" text-anchor="middle">暖橙径向底 + 厚圆角描边, 无文字(代码叠加)</text>
    <text x="960" y="472" fill="#94a3b8" font-size="9" text-anchor="middle">1024×1024 → 圆角烘焙 → mipmap 多密度</text>

    <!-- palette -->
    <text x="830" y="530" fill="#fbbf24" font-size="11" font-weight="700">配色规范 Palette</text>
    <rect x="830" y="544" width="70" height="34" rx="6" fill="#f59e0b"/>
    <text x="865" y="596" fill="#94a3b8" font-size="8" text-anchor="middle">#F59E0B 主行动</text>
    <rect x="915" y="544" width="70" height="34" rx="6" fill="#0b3d2e" stroke="#34d399"/>
    <text x="950" y="596" fill="#94a3b8" font-size="8" text-anchor="middle">#0B3D2E 菜单底</text>
    <rect x="1000" y="544" width="70" height="34" rx="6" fill="#22c55e"/>
    <text x="1035" y="596" fill="#94a3b8" font-size="8" text-anchor="middle">#22C55E 可食环</text>
    <rect x="830" y="620" width="70" height="34" rx="6" fill="#ef4444"/>
    <text x="865" y="672" fill="#94a3b8" font-size="8" text-anchor="middle">#EF4444 危险环</text>
    <rect x="915" y="620" width="70" height="34" rx="6" fill="#7dd3fc"/>
    <text x="950" y="672" fill="#94a3b8" font-size="8" text-anchor="middle">#7DD3FC 天空</text>
    <rect x="1000" y="620" width="70" height="34" rx="6" fill="#86efac"/>
    <text x="1035" y="672" fill="#94a3b8" font-size="8" text-anchor="middle">#86EFAC 草地</text>
    <text x="960" y="720" fill="#94a3b8" font-size="9" text-anchor="middle">厚描边卡通 / 高饱和 / 圆角一切</text>
    <text x="960" y="740" fill="#94a3b8" font-size="9" text-anchor="middle">按钮: 胶囊形 · 主行动琥珀 · 次级半透明白</text>
  </g>

  <!-- ============ RIGHT: 生成资产清单 ============ -->
  <g>
    <rect x="1160" y="100" width="370" height="700" rx="12" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
    <text x="1180" y="132" fill="#34d399" font-size="12" font-weight="700">flowith 生成资产清单 (GPT Image 2.5 Sunburst)</text>
    <text x="1180" y="170" fill="white" font-size="11" font-weight="600">A. icon.png — 1:1 1024px</text>
    <text x="1180" y="190" fill="#94a3b8" font-size="9">卡通应用图标: 男孩双手接住发光金豆, 豆子沿弧线</text>
    <text x="1180" y="206" fill="#94a3b8" font-size="9">下落; 暖橙黄径向渐变底; 厚白描边; 无文字; 满幅</text>
    <text x="1180" y="244" fill="white" font-size="11" font-weight="600">B. title_emblem.png — 16:9</text>
    <text x="1180" y="264" fill="#94a3b8" font-size="9">菜单主视觉: 男孩跃起张臂, 金豆弧线环绕, 草地</text>
    <text x="1180" y="280" fill="#94a3b8" font-size="9">飞溅; 透明感亮色构图, 主体居中偏左留白给标题</text>
    <text x="1180" y="318" fill="white" font-size="11" font-weight="600">C. 应用方式</text>
    <text x="1180" y="338" fill="#94a3b8" font-size="9">icon → 圆角烘焙 → mipmap 多密度</text>
    <text x="1180" y="356" fill="#94a3b8" font-size="9">emblem → MenuPanel 顶部标题位 + HappyEat 字样叠加</text>
    <text x="1180" y="394" fill="white" font-size="11" font-weight="600">D. 代码侧美化 (不生成, 直接改)</text>
    <text x="1180" y="414" fill="#94a3b8" font-size="9">胶囊按钮 (主琥珀/次半透明白) · 圆角卡片面板</text>
    <text x="1180" y="432" fill="#94a3b8" font-size="9">HUD 半透明底板 · 标题阴影 · 菜单深绿渐变压暗</text>
    <text x="1180" y="470" fill="#34d399" font-size="10" font-weight="600">风格锚点: 与现有 12 个厚描边卡通精灵一致</text>
  </g>

  <!-- flow arrows -->
  <path d="M 380 450 C 402 450, 398 450, 416 450" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 760 450 C 782 450, 778 450, 796 450" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 1130 450 C 1148 450, 1144 450, 1156 450" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
